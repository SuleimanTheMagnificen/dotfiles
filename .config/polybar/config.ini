[colors]
background = #1C1C14
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880
workspace_fg=#CCC512
workspace_bg=#566178

[bar/example]
width = 100%
height = 24pt
radius = 8

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 8pt
border-color = #00000000

padding-left = 0 
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace:size=10;2
font-1 = Noto Sans:size=10;2
font-2 = Monofur Nerd Font:size=12;3
font-3 = Noto Sans CJK JP:style=Regulars:size=9.5;1
font-4 = Noto Sans Arabic,Noto Sans Arabic Cond Med:style=Condensed Medium,Regular:size=11;1
font-5 = Material Design Icons:style=Regular:size=16;2
font-6 = Roboto:style=Regular:size=11;2
font-7 = FontAwesome:size=11;2

#font-0 = Noto Sans:style=Regular:size=11;2
; font-1 = Font Awesome 6 Brand Regular:antialias=false:style=Regular:size=10;2
; font-0 = monospace:size=10;2

modules-left = xworkspaces xwindow
modules-right = playerctl cmus_wrapper systray pulseaudio xkeyboard memory cpu wlan date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
enable-struts = true
; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

#override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 2pt
tray-spacing = 8pt
tray-size=50%

[module/xworkspaces]
type = internal/xworkspaces
#border-right=0
label-font=1

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1 

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:35:...%
label-maxlen = 35px
#label-background=${colors.workspace_bg}
label-font=3
#label-foreground=${colors.workspace_fg
; Available tags:
;   <label> (default)
format = <label>
#format-background = ${colors.workspace_bg}
#format-foreground = ${colors.workspace_fg}
#format-padding = 2
label-empty = Empty
label-empty-foreground = #707880
#module-margin=10pt
#padding={3,3}
#label-margin-left=3pt
#label-margin-right=3pt
#label-indicator-padding = 3px
#border-left=2
label-focused-padding = 2
label-occupied-padding = 2
label-empty-padding = 2
label-indicator-padding = 2
label-indicator-margin = 1

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-online = <label-song>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}
tail=true
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/playerctl]
type = custom/script
# refresh music info every 3 seconds, check if player is active every 2.5 seconds
interval = 1
interval-if = 2.75:wired

exec = ~/.config/polybar/bin/music-info.sh &
# only execute the script if the the player is active
execif = ~/.config/polybar/bin/playerctl-status.sh &


format-prefix="󰝚  "
#format-prefix = " "
format-prefix-foreground = ${colors.primary} 
#label=%output%
#label-font=1
label = %{A1:playerctl play-pause &:}󰐎%{A}  %output:0:15:...% %{A1:playerctl previous &:}󰒮%{A} %{A1:playerctl next &:}󰒭%{A}
#label-maxlen=60%
#click-left = playerctl play
#click-right = playerctl pause 
#tail=true
[module/music]
type = custom/script
interval = 0.1

label = %output%
exec = ~/.config/polybar/music
#tail = true

[module/cmus]
type = custom/script

exec = ~/.config/polybar/bin/cmus.sh
exec-if = pgrep -x cmus
interval = 1

click-left = cmus-remote --next
click-right = cmus-remote --prev
click-middle = cmus-remote --pause
scroll-up = cmus-remote --volume +5%
scroll-down = cmus-remote --volume -5%

#label-font = 3
format = <label>
format-underline = ${colors.foreground-alt}
label = %output%
label-maxlen = 50

[module/cmus_wrapper]
internal = 1
type = custom/script
#tail = true
exec = sh ~/.config/polybar/bin/cmus_wrapper.sh 2> /dev/null
click-left = cmus-remote --pause
click-right = cmus-remote --prev
click-middle = cmus-remote --next
scroll-up = cmus-remote --volume +5%
scroll-down = cmus-remote --volume -5%
label=%output%
label-maxlen=18pt
label-empty=""
#format-prefix="󰝚  "
[module/volume]
type = internal/pulseaudio
speaker-mixer = Speaker
headphone-mixer = Headphone
headphone-id = 9

format-volume = <bar-volume>
format-volume-prefix = "  "
format-volume-foreground = ${colors.foreground}

format-muted-prefix = "  "
format-muted-foreground = ${colors.disabled}
label-muted = " ○○○○○○○○○○"

bar-volume-width = 10
bar-volume-gradient = false
bar-volume-indicator = ●
bar-volume-fill = ●
bar-volume-empty = ○
bar-volume-empty-foreground = ${colors.foreground}

[module/i3]
type = internal/i3

index-sort = true

format = <label-state> <label-mode>
format-underline = ${colors.foreground}

label-focused = 
label-focused-foreground = ${colors.foreground}
label-focused-font = 2
label-focused-padding = 4

label-unfocused = 
label-unfocused-foreground = ${colors.disabled}
label-unfocused-font = 2
label-unfocused-padding = 4

label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-font = 2
label-urgent-padding = 4
