map kitty_mod+e combine : new_window : next_layout
#startup_session launch.conf

# Fonts
font_size 10

# Window
window_margin_width 8
window_border_width 1.3
window_padding_width 4
single_window_padding_width 2
single_window_margin_width 4
hide_window_decorations yes
background_opacity 0.75
background_blur 1
dynamic_background_opacity no
transparent_background_colors red@0.5 #00ff00@0.3

# The basic colors
foreground  #ecffcf
#background  #282828
selection_foreground    #434547
selection_background    #d4be98

# Cursor colors
cursor                  #d4be98
cursor_text_color       #282828

# URL underline color when hovering with mouse
url_color               #d4be98

# Colors for marks (marked text in the terminal)
mark1_foreground #282828
mark1_background #7daea3
mark2_foreground #282828
mark2_background #d3869b
mark3_foreground #282828
mark3_background #89b482

# The 16 terminal colors

# black
color0 #282828
color8 #7c6f64

# red
color1 #ea6962
color9 #ea6962

# green
color2  #a9b665
color10 #a9b665

# yellow
color3  #d8a657
color11 #d8a657

# blue
color4  #7daea3
color12 #7daea3

# purple
color5  #d3869b
color13 #d3869b

# aqua
color6  #89b482
color14 #89b482

# white
color7  #a89984
color15 #d4be98

# OS window confirmation disable
confirm_os_window_close 0

tab_separator " ┇"


# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map f5 launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map f6 launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map f4 launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f7 layout_action rotate

# Move the active window in the indicated direction
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# Move the active window to the indicated screen edge
map ctrl+shift+up layout_action move_to_screen_edge top
map ctrl+shift+left layout_action move_to_screen_edge left
map ctrl+shift+right layout_action move_to_screen_edge right
map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Set the bias of the split containing the currently focused window. The
# currently focused window will take up the specified percent of its parent
# window's size.
map ctrl+. layout_action bias 80

map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter 3
# reset all windows in the tab to default sizes
map ctrl+home resize_window reset
map ctrl+tab next_tab

map ctrl+shift+a>m set_background_opacity +0.1
map ctrl+shift+a>l set_background_opacity -0.1

# BEGIN_KITTY_FONTS
font_family      family="NotoSansM Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
